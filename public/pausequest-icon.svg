<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle representing a timer/clock -->
  <circle cx="50" cy="50" r="45" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Pause button symbol (two vertical bars) -->
  <rect x="35" y="25" width="8" height="50" rx="2" fill="white"/>
  <rect x="57" y="25" width="8" height="50" rx="2" fill="white"/>
  
  <!-- Clock hands to indicate time management -->
  <line x1="50" y1="50" x2="50" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="65" y2="50" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small dots representing break/mood tracking -->
  <circle cx="25" cy="75" r="3" fill="#60a5fa"/>
  <circle cx="50" cy="80" r="3" fill="#60a5fa"/>
  <circle cx="75" cy="75" r="3" fill="#60a5fa"/>
</svg>
